name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # All three platforms the README promises. macOS was missing, and it is
        # the one where a path bug lived through a green CI for a whole release:
        # the turn runner spawned a Windows path everywhere.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: package contents
        run: npm pack --dry-run
